; PlatformIO Project Configuration File
; WiFi FTM (IEEE 802.11mc) demo for Seeed Studio XIAO ESP32-C6
;
; Two environments — flash each to one board:
;   ftm_responder  → /dev/ttyACM0  (becomes the WiFi AP + FTM responder)
;   ftm_initiator  → /dev/ttyACM1  (measures distance, prints to serial)
;
; If the boards are swapped, exchange the upload_port / monitor_port values.

[platformio]
src_dir = demos

[seeed_c6_base]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-esp32-c6
framework = arduino
monitor_speed = 115200
; GCC 14 toolchain required for ESP32-C6 (_zicsr_zifencei ISA extensions).
; The Seeed platform uses platformio/toolchain-riscv32-esp, not espressif's.
platform_packages =
    platformio/toolchain-riscv32-esp@14.2.0+20251107
build_unflags = -std=gnu++2b
build_flags =
    -std=gnu++2a
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
monitor_rts = 0
monitor_dtr = 0

[env:ftm_responder]
extends = seeed_c6_base
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
build_src_filter = -<*> +<ftm_responder.cpp>

[env:ftm_initiator]
extends = seeed_c6_base
upload_port = /dev/ttyACM1
monitor_port = /dev/ttyACM1
build_src_filter = -<*> +<ftm_initiator.cpp>
