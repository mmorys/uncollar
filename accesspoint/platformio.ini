; PlatformIO Project Configuration File
; WiFi FTM (IEEE 802.11mc) demo for Seeed Studio XIAO ESP32-C6
;
; Three environments — flash each to one board:
;   ftm_responder_a → /dev/ttyACM0  (anchor A: SoftAP + FTM responder, channel 1)
;   ftm_responder_b → /dev/ttyACM1  (anchor B: SoftAP + FTM responder, channel 1)
;   ftm_initiator   → /dev/ttyACM2  (measures distance to every anchor)
;
; Both anchors sit on the same channel so the initiator never has to hop — this
; is the simplest, fastest topology (at the cost of mutual interference). If the
; boards enumerate in a different order, swap the upload_port / monitor_port
; values below.

[platformio]
src_dir = demos

[seeed_c6_base]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-esp32-c6
framework = arduino
monitor_speed = 115200
; GCC 14 toolchain required for ESP32-C6 (_zicsr_zifencei ISA extensions).
; The Seeed platform uses platformio/toolchain-riscv32-esp, not espressif's.
platform_packages =
    platformio/toolchain-riscv32-esp@14.2.0+20251107
build_unflags = -std=gnu++2b
build_flags =
    -std=gnu++2a
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
monitor_rts = 0
monitor_dtr = 0

[env:ftm_responder_a]
extends = seeed_c6_base
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
build_src_filter = -<*> +<ftm_responder.cpp>
build_flags =
    ${seeed_c6_base.build_flags}
    -DANCHOR_NAME='"FTM_Anchor_A"'
    -DANCHOR_CHANNEL=1

[env:ftm_responder_b]
extends = seeed_c6_base
upload_port = /dev/ttyACM1
monitor_port = /dev/ttyACM1
build_src_filter = -<*> +<ftm_responder.cpp>
build_flags =
    ${seeed_c6_base.build_flags}
    -DANCHOR_NAME='"FTM_Anchor_B"'
    -DANCHOR_CHANNEL=1

[env:ftm_initiator]
extends = seeed_c6_base
upload_port = /dev/ttyACM2
monitor_port = /dev/ttyACM2
build_src_filter = -<*> +<ftm_initiator.cpp>
