; PlatformIO Project Configuration File
; WiFi FTM (IEEE 802.11mc) ranging demo.
;
; Three environments — flash each to its board:
;   ftm_responder_a → /dev/ttyACM1  XIAO ESP32-C6 anchor A (SoftAP + FTM responder, ch 1)
;   ftm_responder_b → /dev/ttyACM2  XIAO ESP32-C6 anchor B (SoftAP + FTM responder, ch 1)
;   ftm_initiator   → /dev/ttyACM0  Adafruit QT Py ESP32-S3 mobile node (ranges anchors,
;                                   shows distances on the I2C LCD1602)
;
; Both anchors sit on the same channel so the initiator never has to hop — this
; is the simplest, fastest topology (at the cost of mutual interference). If the
; boards enumerate in a different order, swap the upload_port / monitor_port
; values below.
;
; ALL boards build on the Seeed platform (the initiator is an ESP32-S3, the same
; chip family as the XIAO ESP32-S3 board def used below). Keeping the project on
; a single platform avoids a nasty conflict: collar/ uses the espressif32
; platform, and if its packages and these ever resolve together they fight over
; the shared framework-arduinoespressif32* / tool-esptoolpy package names. The
; platform_packages pins in [seeed_common] lock this project to the exact
; versions the Seeed platform declares so that conflict can't break the build.

[platformio]
src_dir = demos

[seeed_common]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++2b
; Lock framework + esptool to the Seeed-declared versions. Without these, the
; espressif32 platform (used by collar/) can upgrade the shared packages to
; versions whose esptool elf2image CLI is incompatible with this image step.
platform_packages =
    framework-arduinoespressif32@https://github.com/espressif/arduino-esp32/releases/download/3.3.7/esp32-core-3.3.7.tar.xz
    framework-arduinoespressif32-libs@https://github.com/espressif/arduino-esp32/releases/download/3.3.7/esp32-core-3.3.7-libs.tar.xz
    tool-esptoolpy@https://files.seeedstudio.com/arduino/platformio/esptoolpy-v5.1.2.zip
monitor_rts = 0
monitor_dtr = 0

; --- Anchors: Seeed Studio XIAO ESP32-C6 ---
[seeed_c6_base]
extends = seeed_common
board = seeed-xiao-esp32-c6
; GCC 14 RISC-V toolchain required for ESP32-C6 (_zicsr_zifencei ISA extensions).
platform_packages =
    ${seeed_common.platform_packages}
    platformio/toolchain-riscv32-esp@14.2.0+20251107
build_flags =
    -std=gnu++2a
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:ftm_responder_a]
extends = seeed_c6_base
upload_port = /dev/ttyACM1
monitor_port = /dev/ttyACM1
build_src_filter = -<*> +<ftm_responder.cpp>
build_flags =
    ${seeed_c6_base.build_flags}
    -DANCHOR_NAME='"FTM_Anchor_A"'
    -DANCHOR_CHANNEL=1

[env:ftm_responder_b]
extends = seeed_c6_base
upload_port = /dev/ttyACM2
monitor_port = /dev/ttyACM2
build_src_filter = -<*> +<ftm_responder.cpp>
build_flags =
    ${seeed_c6_base.build_flags}
    -DANCHOR_NAME='"FTM_Anchor_B"'
    -DANCHOR_CHANNEL=1

; --- Mobile node: Adafruit QT Py ESP32-S3 with I2C LCD1602 (STEMMA QT @ 0x27) ---
; Uses an ESP32-S3 board def (same chip as the QT Py S3). The LCD I2C pins
; (Wire1 on 41/40) are set in code, so the XIAO variant's pin aliases don't
; matter here.
[env:ftm_initiator]
extends = seeed_common
board = seeed-xiao-esp32-s3-sense
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
lib_deps =
    robtillaart/I2C_LCD
build_flags =
    -std=gnu++2a
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = -<*> +<ftm_initiator.cpp>
