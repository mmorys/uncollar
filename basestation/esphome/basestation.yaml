esphome:
  name: uncollar-basestation
  friendly_name: Uncollar Basestation
  includes:
    - uncollar_protocol.h

esp32:
  board: adafruit_qtpy_esp32
  framework:
    type: arduino
    advanced:
      minimum_chip_revision: 3.0

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Uncollar Basestation"
    password: !secret basestation_wifi_ap_password
  manual_ip:
    static_ip: !secret basestation_wifi_static_ip
    gateway: !secret basestation_wifi_gateway
    subnet: !secret basestation_wifi_subnet

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key
  services:
    - service: send_boundary_update
      variables:
        default_lat: float
        default_lon: float
        boundary_lats: float[]
        boundary_lons: float[]
        warn_after_seconds: int
        repeat_warn_seconds: int
        warn_action: int        # 0 = beep, 1 = vibrate
      then:
        - lambda: |-
            if (boundary_lats.size() != boundary_lons.size()
                || boundary_lats.size() < 3
                || boundary_lats.size() > 16) {
              ESP_LOGE("uncollar", "Invalid boundary: need 3-16 matched lat/lon pairs, got %d/%d",
                       (int)boundary_lats.size(), (int)boundary_lons.size());
              return;
            }
            // Variable-length wire format:
            //   [0x10][defaultLat:4][defaultLon:4][warnAfter:2][repeatWarn:2]
            //   [warnAction:1][vertexCount:1][vertex0.lat:4][vertex0.lon:4]...
            uint8_t vcnt = (uint8_t)boundary_lats.size();
            size_t pkt_size = 1 + 4 + 4 + 2 + 2 + 1 + 1 + vcnt * sizeof(GeoPoint);
            std::vector<uint8_t> buf(pkt_size);
            buf[0] = (uint8_t)MessageType::ConfigUpdate;
            size_t off = 1;
            memcpy(buf.data() + off, &default_lat, 4); off += 4;
            memcpy(buf.data() + off, &default_lon, 4); off += 4;
            uint16_t warn_after  = (uint16_t)warn_after_seconds;
            uint16_t warn_repeat = (uint16_t)repeat_warn_seconds;
            memcpy(buf.data() + off, &warn_after,  2); off += 2;
            memcpy(buf.data() + off, &warn_repeat, 2); off += 2;
            buf[off++] = (uint8_t)(warn_action == 1 ? 1 : 0);
            buf[off++] = vcnt;
            for (int i = 0; i < (int)vcnt; i++) {
              float lat = boundary_lats[i];
              float lon = boundary_lons[i];
              memcpy(buf.data() + off, &lat, 4); off += 4;
              memcpy(buf.data() + off, &lon, 4); off += 4;
            }
            id(pending_config_packet) = buf;
            id(pending_config)        = true;
            id(config_update_status).publish_state("Queued");
            ESP_LOGI("uncollar", "Config queued: %d vertices (%d bytes), home=(%.6f, %.6f), warn after %ds repeat %ds action=%d",
                     (int)vcnt, (int)pkt_size, default_lat, default_lon,
                     (int)warn_after, (int)warn_repeat, (int)(warn_action == 1 ? 1 : 0));

ota:
  - platform: esphome
    password: !secret basestation_ota_password

logger:

globals:
  - id: pending_config
    type: bool
    initial_value: 'false'
  - id: pending_config_packet
    type: std::vector<uint8_t>
    restore_value: false

spi:
  clk_pin: GPIO14
  mosi_pin: GPIO13
  miso_pin: GPIO12
  interface: spi2

sx127x:
  id: lora_radio
  cs_pin: GPIO26
  rst_pin: GPIO25
  dio0_pin: GPIO27
  frequency: 915000000
  modulation: LORA
  bandwidth: 125_0kHz
  spreading_factor: 9
  coding_rate: CR_4_7
  sync_value: !secret basestation_lora_sync_word
  pa_pin: BOOST
  pa_power: 17
  preamble_size: 8
  on_packet:
    - lambda: |-
        if (x.size() < 1) return;
        uint8_t msg_type = x[0];

        if (msg_type == (uint8_t)MessageType::PositionReport
            && x.size() == 1 + sizeof(PositionReport)) {
          PositionReport r;
          memcpy(&r, x.data() + 1, sizeof(r));
          id(dog_latitude).publish_state(r.latitude);
          id(dog_longitude).publish_state(r.longitude);
          id(dog_satellites).publish_state(r.satellites);
          id(dog_battery_mv).publish_state(r.batteryMv);
          id(dog_inside_boundary).publish_state(r.insideBoundary);
          id(lora_rssi).publish_state(rssi);

          if (id(pending_config)) {
            id(lora_radio).transmit_packet(id(pending_config_packet));
            id(pending_config) = false;
            id(config_update_status).publish_state("Sent");
            ESP_LOGI("uncollar", "ConfigUpdate sent to collar");
          }
        }

        if (msg_type == (uint8_t)MessageType::BoundaryAlert
            && x.size() == 1 + sizeof(BoundaryAlert)) {
          BoundaryAlert a;
          memcpy(&a, x.data() + 1, sizeof(a));
          id(boundary_alert).publish_state(!a.enteredBoundary);
        }

sensor:
  - platform: template
    id: dog_latitude
    name: "Dog Latitude"
    unit_of_measurement: "°"
    accuracy_decimals: 6
    update_interval: never

  - platform: template
    id: dog_longitude
    name: "Dog Longitude"
    unit_of_measurement: "°"
    accuracy_decimals: 6
    update_interval: never

  - platform: template
    id: dog_satellites
    name: "Dog GPS Satellites"
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: dog_battery_mv
    name: "Collar Battery"
    unit_of_measurement: "mV"
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: lora_rssi
    name: "LoRa RSSI"
    unit_of_measurement: "dBm"
    accuracy_decimals: 0
    update_interval: never

binary_sensor:
  - platform: template
    id: dog_inside_boundary
    name: "Dog Inside Boundary"

  - platform: template
    id: boundary_alert
    name: "Boundary Alert"

text_sensor:
  - platform: template
    id: config_update_status
    name: "Config Update Status"
    update_interval: never
