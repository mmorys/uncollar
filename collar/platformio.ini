; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
test_dir = tests
; credentials.ini is gitignored — copy credentials.ini.example to create it.
; If absent the glob matches nothing and LORA_SYNC_WORD falls back to the
; RadioLib default (0x12) via the #ifndef guard in lib/radio/radio.cpp.
extra_configs = credentials*.ini

; Default empty credentials — overridden by credentials.ini when present.
[credentials]
build_flags =

[env:mcu]
platform = espressif32
board = adafruit_qtpy_esp32s3_nopsram
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyACM1
monitor_port = /dev/ttyACM1
lib_deps =
	robtillaart/I2C_LCD
	adafruit/Adafruit GPS Library@^1.7.5
	jgromes/RadioLib@^7.1.2
; Use the chip's built-in USB-Serial-JTAG (HWCDC) instead of TinyUSB-CDC.
; TinyUSB hides the JTAG interface, blocking esp-builtin upload; HWCDC
; exposes CDC + JTAG simultaneously and survives firmware crashes.
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	${credentials.build_flags}
; Upload via the chip's built-in USB-JTAG instead of the flaky 1200bps DTR
; reset trick (which requires the running firmware to cooperate with its
; own reset). NOTE: the very first upload from a board running TinyUSB-CDC
; firmware will fail because JTAG isn't exposed yet — temporarily comment
; this out, or hold BOOT + tap RESET to enter ROM download mode for one run.
; upload_protocol = esp-builtin
monitor_rts = 0
monitor_dtr = 0

[env:gps_demo]
platform = espressif32
board = adafruit_qtpy_esp32s3_nopsram
framework = arduino
monitor_speed = 115200
lib_deps =
	adafruit/Adafruit GPS Library@^1.7.5
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = -<*> +<../demos/gps_demo.cpp>
monitor_rts = 0
monitor_dtr = 0

[env:radio_tx_demo]
platform = espressif32
board = adafruit_qtpy_esp32s3_nopsram
framework = arduino
monitor_speed = 115200
lib_deps =
	jgromes/RadioLib@^7.1.2
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
; Use esp-builtin (JTAG) once HWCDC firmware is on the board.
; For the very first upload, hold BOOT + tap RESET to enter ROM download mode,
; then temporarily comment this out and use the default esptool protocol.
; upload_protocol = esp-builtin
build_src_filter = -<*> +<../demos/radio_tx_demo.cpp>
monitor_rts = 0
monitor_dtr = 0

[env:spi_raw_demo]
platform = espressif32
board = adafruit_qtpy_esp32s3_nopsram
framework = arduino
monitor_speed = 115200
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = -<*> +<../demos/spi_raw_demo.cpp>
monitor_rts = 0
monitor_dtr = 0

[env:gps_nmea_log_demo]
platform = espressif32
board = adafruit_qtpy_esp32s3_nopsram
framework = arduino
monitor_speed = 115200
lib_deps =
	adafruit/Adafruit GPS Library@^1.7.5
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = -<*> +<../demos/gps_nmea_log_demo.cpp>
monitor_rts = 0
monitor_dtr = 0

[env:noop_demo]
platform = espressif32
board = adafruit_qtpy_esp32s3_nopsram
framework = arduino
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = -<*> +<../demos/noop_demo.cpp>

; Native environment for running unit tests on host machine
[env:native]
platform = native
build_flags = -std=c++11
lib_deps = 
	throwtheswitch/Unity@^2.5.2
; Exclude Arduino-specific source files from native build
build_src_filter = 
	-<.*>
; Run all native test suites (test_native, test_native_gps, …)
test_filter = test_native*
test_build_src = yes

